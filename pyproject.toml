[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaXRD"
version = "0.1.0"
description = "Powder diffraction refinement in JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "jax>=0.4.20",
  "pymatgen>=2024.6.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["jaxrd*"]
